name: generate snake

on:
  schedule:
    - cron: "12 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: generate snake SVGs (ink palette)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=#f4f4f2,#d8d8d4,#b8b8b2,#8a8a84,#2e2e2a,#b3352c
            dist/github-contribution-grid-snake-dark.svg?palette=#16181d,#262a31,#3a4048,#59616c,#c9d1d9,#d1483c

      - name: push snake to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
