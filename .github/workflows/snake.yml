name: generate snake

on:
  schedule:
    - cron: "12 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: generate snake SVGs (ink palette)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#b3352c&color_dots=#e6e4de,#c9c6bd,#a5a29a,#6b6963,#343430
            dist/github-contribution-grid-snake-dark.svg?color_snake=#d1483c&color_dots=#16181d,#262a31,#3a4048,#59616c,#c9d1d9

      - name: push snake to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
